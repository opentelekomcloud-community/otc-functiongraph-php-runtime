# nginx worker runs as the current (non-root) user; master process skips user directive
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stdout warn;

events {
    worker_connections 1024;
}


http {
    # https://nginx.org/en/docs/http/ngx_http_log_module.html
    log_format  main  '[$time_iso8601] [NGINX] [$http_x_cff_request_id] $remote_addr - $remote_user "$request"';
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout main;

    # temp paths writable by non-root
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8000;
        root /home/paas_user/src/public;
        index index.php;

        # equivalent to the .htaccess rewrite rule
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       /etc/nginx/fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
